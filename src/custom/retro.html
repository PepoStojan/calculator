<div class="rc"><div class="calc" role="group" aria-label="ELECTRA 8 calculator">
  <span class="strip l"></span><span class="strip r"></span>

  <div class="head">
    <div class="brand">ELECTRA 8<small>ELECTRONIC CALCULATOR</small></div>
    <div class="snd">
      <button id="snd" type="button" aria-pressed="false" aria-label="Key click sound"></button>
      CLICK
    </div>
  </div>

  <div class="window">
    <div class="glass">
      <div class="digits" id="digits" role="img" aria-label="Calculator display"></div>
    </div>
  </div>

  <div class="pad" id="pad">
    <button class="key clr" data-k="C">C</button>
    <button class="key clr" data-k="CE">CE</button>
    <button class="key fn" data-k="%">%</button>
    <button class="key op" data-k="/">÷</button>

    <button class="key" data-k="7">7</button>
    <button class="key" data-k="8">8</button>
    <button class="key" data-k="9">9</button>
    <button class="key op" data-k="*">×</button>

    <button class="key" data-k="4">4</button>
    <button class="key" data-k="5">5</button>
    <button class="key" data-k="6">6</button>
    <button class="key op" data-k="-">−</button>

    <button class="key" data-k="1">1</button>
    <button class="key" data-k="2">2</button>
    <button class="key" data-k="3">3</button>
    <button class="key op" data-k="+">+</button>

    <button class="key fn" data-k="±">±</button>
    <button class="key" data-k="0">0</button>
    <button class="key" data-k=".">.</button>
    <button class="key eq" data-k="=">=</button>
  </div>

  <div class="foot">SOLID STATE</div>
</div></div>

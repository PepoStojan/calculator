<div class="sci" id="sci">
  <div class="sci-top">
    <label class="sr" for="sci-in">Expression</label>
    <input id="sci-in" class="sci-in" type="text" inputmode="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Type or tap: 2*(3+4)^2" aria-describedby="sci-out">
    <output id="sci-out" class="sci-out" aria-live="polite">0</output>
  </div>
  <div class="sci-grid" id="sci-grid"></div>
  <div class="sci-hist" id="sci-hist" aria-label="History"></div>
</div>
